<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <div class="container">
    <header class="site-header">
        <div class="logo">
            <img src="Logo-light.png" alt="Ink & Insights" class="logo-light">
            <img src="Logo-dark.png" alt="Ink & Insights Logo" class="logo-dark">
        </div>
        <div class="Ad-container">
            <img src="Arirang.jpg" alt="BTS Arirang Ad">
        </div>
    </header>
    <nav class="nav-bar">
        <ul class="category">
            <li><a href="#">Fashion</a></li>
            <li><a href="#">Tech</a></li>
            <li><a href="#">Lifestyle</a></li>
        </ul>
        <div class="theme">
            <input type="checkbox" id="theme-toggle">
        </div>
    </nav>
    <div class="news-ticker">
        <span class="ticker-lable">Breaking News</span>
        <p>Grand Live Concert in Germany - July 24, 2026</p>
    </div>
    <section class="top-stories">
        <article class="primary-post" style="background-image: url('https://picsum.photos/800/500?sig=1'); background-size: cover;">
            <div class="caption-box">
                <h3>Breaking: New Tech Revolutionizes Web Dev</h3>
            </div>
        </article>
        <div class="small-post-group">
            <article class="side-card" style="background-image: url('https://picsum.photos/400/400?sig=2'); background-size: cover;">Fashion Trends</article>
            <article class="side-card" style="background-image: url('https://picsum.photos/400/400?sig=3'); background-size: cover;">New Gadgets</article>
            <article class="side-card" style="background-image: url('https://picsum.photos/400/400?sig=4'); background-size: cover;">Sports</article>
            <article class="side-card" style="background-image: url('https://picsum.photos/400/400?sig=5'); background-size: cover;">Health</article>
        </div>
    </section>
    <section class="bottom-feed">
        <article class="mini-card">
            <div class="thumb-box"></div>
            <div class="news-info">
                <h4>Art Exhibition Starting This Week</h4>
                <p>July 24, 2026</p>
            </div>
        </article>
    </section>
</div>
<script src="script.js"></script>
</body>
</html>
