<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <div class="container">
    <header class="site-header">
        <div class="logo">
            <img src="Logo-light.png" alt="Ink & Insights" class="logo-light">
            <img src="Logo-dark.png" alt="Ink & Insights Logo" class="logo-dark">
        </div>
        <div class="Ad-container">
            <img src="Arirang.jpg" alt="BTS Arirang Ad">
        </div>
    </header>

    <nav class="nav-bar">
        <ul class="category">
            <li><a href="#fashion">Fashion</a></li>
            <li><a href="#tech">Tech</a></li>
            <li><a href="#lifestyle">Lifestyle</a></li>
        </ul>
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Search news..." onkeyup="searchNews()">
        </div>
        <div class="theme">
            <input type="checkbox" id="theme-toggle">
        </div>
    </nav>

    <div class="news-ticker">
        <span class="ticker-lable">Breaking News</span>
        <p><span id="current-date"></span> | Grand Live Concert in Germany</p>
    </div>

    <!-- FASHION SECTION (The Main Stories) -->
    <h2 id="fashion" class="section-title">Latest in Fashion & Trends</h2>
    <section class="top-stories">
        <article class="primary-post">
            <div class="caption-box">
                <h3>Loading Breaking News...</h3>
            </div>
        </article>
        <div class="small-post-group">
            <!-- News API will fill these -->
        </div>
    </section>

    <!-- TECH SECTION -->
    <h2 id="tech" class="section-title">Technology & Gadgets</h2>
    <section class="bottom-feed">
        <article class="mini-card">
            <div class="thumb-box"></div>
            <div class="news-info">
                <h4>Art Exhibition Starting This Week</h4>
                <p>July 24, 2026</p>
            </div>
        </article>
    </section>

    <!-- LIFESTYLE SECTION -->
    <h2 id="lifestyle" class="section-title">Lifestyle</h2>
    <section class="bottom-feed">
        <article class="mini-card">
            <div class="thumb-box"></div>
            <div class="news-info">
                <h4>Upcoming Wellness Retreat</h4>
                <p>August 10, 2026</p>
            </div>
        </article>
    </section>
</div>

<script src="script.js"></script>
</body>
</html>
